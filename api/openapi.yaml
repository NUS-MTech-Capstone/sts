openapi: 3.1.0
info:
  title: DenDenMushi STS API
  version: 0.1.0
  description: "Authorization and short-lived capability token API for SSH sessions and automation runs. Business endpoints require the `x-api-version: 1` header; probe and OpenAPI endpoints are exempt."
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: Service is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /validate:
    post:
      summary: Validate access for start, rejoin, observe, discovery, or stop flows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateRequest"
      responses:
        "200":
          description: Access allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"
        "403":
          description: Access denied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"
  /tokens/session:
    post:
      summary: Recheck trusted CR authorization and issue a scoped session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionTokenRequest"
      responses:
        "201":
          description: Session token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTokenResponse"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /tokens/validate:
    post:
      summary: Validate a scoped session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenValidateRequest"
      responses:
        "200":
          description: Token is valid and allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"
        "403":
          description: Token is invalid or not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"
  /tokens/automation:
    post:
      summary: Issue a scoped automation capability token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationTokenRequest"
      responses:
        "201":
          description: Automation token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationTokenResponse"
        "403":
          $ref: "#/components/responses/Error"
  /tokens/automation/validate:
    post:
      summary: Validate an automation capability token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationTokenValidateRequest"
      responses:
        "200":
          description: Token is valid and allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationValidateResponse"
        "403":
          description: Token is invalid or not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationValidateResponse"
  /workloads/validate:
    post:
      summary: Validate and normalize an allowed Kubernetes workload identity
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Projected service-account token is valid and allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkloadIdentityResponse"
        "403":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Error:
      description: Structured error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    WorkloadIdentityResponse:
      type: object
      additionalProperties: false
      required: [subject, namespace, serviceAccount]
      properties:
        subject:
          type: string
          example: system:serviceaccount:dendenmushi-agentic:incident-agent
        namespace:
          type: string
          example: dendenmushi-agentic
        serviceAccount:
          type: string
          example: incident-agent
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
    ValidateRequest:
      type: object
      required: [userId, action]
      description: Internal trusted caller assertions. Start, rejoin, observe and rejoin discovery require hostId, crId and actorGroups; observe also requires sessionId. Stop requires sessionId and remains available after CR expiry.
      allOf:
        - if:
            properties:
              action: {enum: [start, rejoin, observe]}
          then:
            required: [hostId, crId, actorGroups]
        - if:
            properties:
              action: {enum: [observe, stop]}
          then:
            required: [sessionId]
      properties:
        actorGroups:
          type: array
          description: Cognito groups verified and subject-bound by Proxy Control Plane; never browser input.
          items: {type: string, minLength: 1}
        userId:
          type: string
        hostId:
          type: string
        crId:
          type: string
        sessionId:
          type: string
        action:
          type: string
          enum: [start, rejoin, observe, stop]
    ValidateResponse:
      type: object
      required: [allowed]
      properties:
        allowed:
          type: boolean
        reason:
          type: string
        claims:
          $ref: "#/components/schemas/SessionClaims"
    SessionTokenRequest:
      type: object
      required: [sessionId, userId, hostId, crId, connectionType, action, mode, actorGroups]
      properties:
        actorGroups:
          type: array
          description: Verified actor groups from the trusted control plane. CR authorization is rechecked before issuance.
          items: {type: string, minLength: 1}
        sessionId:
          type: string
        userId:
          type: string
        hostId:
          type: string
        crId:
          type: string
        connectionType:
          type: string
          enum: [ssh]
        action:
          type: string
          enum: [start, rejoin, observe]
        mode:
          type: string
          enum: [owner, observer]
    SessionTokenResponse:
      type: object
      required: [tokenType, sessionToken, expiresAt]
      properties:
        tokenType:
          type: string
          example: Bearer
        sessionToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    TokenValidateRequest:
      type: object
      required: [sessionId, token]
      properties:
        sessionId:
          type: string
        userId:
          type: string
        hostId:
          type: string
        crId:
          type: string
        connectionType:
          type: string
          enum: [ssh]
        action:
          type: string
          enum: [start, rejoin, observe]
        mode:
          type: string
          enum: [owner, observer]
        token:
          type: string
    SessionClaims:
      type: object
      required: [sessionId, userId, hostId, crId, connectionType, action, mode]
      properties:
        sessionId:
          type: string
        userId:
          type: string
        hostId:
          type: string
        crId:
          type: string
        connectionType:
          type: string
        action:
          type: string
        mode:
          type: string
        address:
          type: string
        username:
          type: string
        credentialSecretId:
          type: string
        hostPublicKey:
          type: string
    AutomationTokenRequest:
      type: object
      required: [runId, incidentId, hostId, phase, allowedOperations, ownerPodId, ownerInstanceId]
      properties:
        runId:
          type: string
        incidentId:
          type: string
        hostId:
          type: string
        phase:
          type: string
        allowedOperations:
          type: array
          items:
            type: string
        planHash:
          type: string
        ownerPodId:
          type: string
        ownerInstanceId:
          type: string
    AutomationTokenResponse:
      type: object
      required: [tokenType, capabilityToken, expiresAt]
      properties:
        tokenType:
          type: string
          example: Bearer
        capabilityToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    AutomationTokenValidateRequest:
      type: object
      required: [runId, token]
      properties:
        runId:
          type: string
        token:
          type: string
    AutomationValidateResponse:
      type: object
      required: [allowed]
      properties:
        allowed:
          type: boolean
        reason:
          type: string
        claims:
          type: object
          additionalProperties: true
